name: Secrets As Env

on:
  workflow_dispatch:

jobs:
  use-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Use secret as env var
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          echo "DOCKER_USERNAME is set: ${DOCKER_USERNAME:+true}"
          echo "Token length: ${#DOCKER_TOKEN}"
